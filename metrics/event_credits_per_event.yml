name: event_credits_per_event
label: Event credits per event
status: agreed
type: ratio
description: Average event credits (leads, or a funnel stage) per included event.
numerator: {metric: event_credits}
denominator: {metric: recruitment_events}
formula: >-
  event credits ÷ included events in the current filter, counting events with zero leads
  in the denominator
unit: contacts_per_event
slice_by: [event_category, event_team_member]
source: hubspot_appointments
owner:
  definition: unassigned
  calculation: Devlin
notes:
  - Shown as "per event" or "/ev" on the recruitment events dashboard.
  - >-
    Display: "0" for zero, "<0.01" for very small values, 2 decimals below 1, otherwise 1
    decimal.
order: 22
